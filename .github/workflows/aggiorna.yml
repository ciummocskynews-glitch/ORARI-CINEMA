name: Aggiorna orari cinema
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python update.py
      - name: Salva le modifiche
        run: |
          git config user.name "orari-bot"
          git config user.email "orari-bot@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Aggiorna orari $(date +%F)"
          git push
